wall_hole_detection:
  ros__parameters:
    # Ebenen-Erkennungs-Parameter
    distance_threshold: 0.05  # Maximale Distanz eines Punktes zur erkannten Ebene (in Metern)
    ransac_iterations: 1000   # Anzahl RANSAC-Iterationen für robustere Erkennung
    min_plane_points: 100     # Mindestanzahl von Punkten für eine gültige Wandebene
    
    # Loch-Erkennungs-Parameter
    hole_width: 0.50          # Erwartete Breite des Lochs in Metern (50cm)
    hole_height: 0.50         # Erwartete Höhe des Lochs in Metern (50cm)
    hole_min_points: 20       # Mindestanzahl von Rasterzellen für ein erkanntes Loch
