# Parameters for entrance detection using 2D front-facing projection
# Optimized for vertical holes in walls (8cm-2m diameter)

hole_detection_clean_node:
  ros__parameters:
    # Entrance size constraints
    height_threshold: 0.1     # Minimum 10cm height
    width_threshold: 0.1      # Minimum 10cm width
    max_width: 2.0            # Maximum 2m width
    min_hole_diameter: 0.08   # Minimum 8cm diameter
    max_hole_diameter: 2.0    # Maximum 2m diameter
    
    # Voxel Grid parameters (Y-Z front projection)
    voxel_size: 0.003         # 3mm voxel (fine precision)
    gaussian_sigma: 0.7       # Limited smoothing for sharp edges
    min_region_cells: 500      # Minimum region size in voxels
    min_surrounded_sides: 2    # Minimum 2 sides surrounded
    
    # Multi-frame accumulation
    frame_buffer_size: 200     # Accumulate 200 frames for stability
    min_buffer_frames_to_search: 100  # Start detection after 100 frames
    process_every_n_frames: 1  # Process every frame
    
    # Confidence tracking
    confidence_threshold: 3    # Minimum 3 detections before publishing
    entrance_timeout: 60       # Frames to keep entrance in memory
