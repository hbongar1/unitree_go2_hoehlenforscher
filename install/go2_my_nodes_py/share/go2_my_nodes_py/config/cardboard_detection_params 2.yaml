# Parameter für Pappe-Cutout Eingangserkennung
# Optimiert für Indoor-Test mit Pappe-Aufbauten

hole_detection_voxel_grid_node:
  ros__parameters:
    # Minimale Eingangs-Dimensionen (angepasst an Pappe-Setup)
    height_threshold: 0.25    # 25cm minimum (kleines Loch ~20cm wird gefiltert)
    width_threshold: 0.25     # 25cm minimum
    max_width: 1.2            # 120cm maximum (großzügig für Tests)
    
    # Voxel Grid spezifisch
    voxel_size: 0.015         # 1.5cm Voxel (feiner für kleine Details)
    gradient_percentile: 70   # Empfindlicher für dünne Pappe-Kanten
    low_density_percentile: 30  # Etwas höher für bessere Loch-Erkennung
    gaussian_sigma: 0.8       # Leichte Glättung
    
    # Clustering
    cluster_distance: 0.4     # Enger für präzisere Gruppierung
    
    # Frame Processing
    frame_buffer_size: 15     # Kleinerer Buffer für schnellere Updates
    process_every_n_frames: 3 # Öfter verarbeiten für Live-Feedback
    
    # Konfidenz
    confidence_threshold: 2   # Niedrig für schnelle erste Erkennung
    entrance_timeout: 30      # Frames bis Eingang vergessen wird
    
    # Ground Plane Detection (NEU)
    enable_ground_detection: true
    ground_plane_distance_threshold: 0.02  # 2cm RANSAC tolerance
    ground_plane_min_points: 100           # Min. Punkte für Ebenen-Fitting
    min_height_above_ground: 0.15          # Filter Punkte < 15cm über Boden
